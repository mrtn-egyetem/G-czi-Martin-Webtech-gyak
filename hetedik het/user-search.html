<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Felhasználó keresés</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 400px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 65%;
            padding: 8px;
        }

        button {
            padding: 8px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background: #eee;
            margin-bottom: 5px;
            border-radius: 5px;
        }

        img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>GitHub felhasználó kereső</h2>

    <input type="text" id="searchInput" placeholder="Felhasználónév...">
    <button id="searchBtn">Keresés</button>

    <ul id="resultList"></ul>
</div>

<script>
    const input = document.getElementById("searchInput");
    const button = document.getElementById("searchBtn");
    const list = document.getElementById("resultList");

    button.addEventListener("click", searchUser);

    function searchUser() {
        const query = input.value.trim();

        
        if (query === "") {
            alert("Adj meg egy felhasználónevet!");
            return;
        }

        
        list.innerHTML = "";

        
        fetch(`https://api.github.com/search/users?q=${query}`)
            .then(response => response.json())
            .then(data => {
                displayUsers(data.items);
            })
            .catch(error => {
                console.error("Hiba történt:", error);
            });
    }

    function displayUsers(users) {
        users.forEach(user => {
            const li = document.createElement("li");

            const img = document.createElement("img");
            img.src = user.avatar_url;

            const name = document.createElement("span");
            name.textContent = user.login;

            li.appendChild(img);
            li.appendChild(name);

            list.appendChild(li);
        });
    }

    
    input.addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            searchUser();
        }
    });
</script>

</body>
</html>
