<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Feladatlista</title>
	<link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 70%;
            padding: 8px;
        }

        button {
            padding: 8px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }

        li {
            padding: 8px;
            background: #eee;
            margin-bottom: 5px;
            cursor: pointer;
            border-radius: 5px;
        }

        li.done {
            text-decoration: line-through;
            background: #cfcfcf;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Teendők</h2>
    <input type="text" id="todoInput" placeholder="Új feladat...">
    <button id="addBtn">Hozzáadás</button>

    <ul id="todoList"></ul>
</div>

<script>
    const input = document.getElementById("todoInput");
    const button = document.getElementById("addBtn");
    const list = document.getElementById("todoList");

    button.addEventListener("click", addTodo);

    function addTodo() {
        const text = input.value.trim();

        if (text === "") return;

        const li = document.createElement("li");
        li.textContent = text;

        // Kattintásra áthúzás (toggle)
        li.addEventListener("click", function() {
            li.classList.toggle("done");
        });

        list.appendChild(li);

        input.value = "";
    }

    // Enter lenyomásra is hozzáadás
    input.addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            addTodo();
        }
    });
</script>

</body>
</html>
